			@import url("https://fonts.googleapis.com/css2?family=Space%20Grotesk:wght@400;700&family=Space%20Mono:wght@400;700&display=swap");

			:root {
				--font-heading: "Space Grotesk", sans-serif;
				--font-body: "Space Mono", serif;
			}

			body {
				background-color: #121113;
				color: #eeeef0;
			}

			h1 {
				font-family: var(--font-heading);
				font-weight: bold;
				font-size: 2.25rem;
				line-height: 2.5rem; /* 4xl */
			}

			p {
				font-family: var(--font-body);
				/*color: #3a3a3a;*/
			}

			button {
				transition-property: all;
				transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
				transition-duration: 150ms;

				cursor: crosshair;
				color: #eeeef0;
				border-color: #eeeef0;
				border-width: 3px;
				opacity: 70%;
			}
			button > * {
				pointer-events: none;
			}
			button:hover {
				opacity: 100%;
			}

			.bg-dark {
				background-color: #121113;
			}

			.border-gray {
				border-width: 1px;
				border-color: #3a3a3a;
			}

			.border-white {
				border-width: 2px;
				border-color: #eeeef0;
			}

			.bg-noise {
				background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
			}

			.bg-grid {
				background-size: 40px 40px;
				background-image: linear-gradient(
						to right,
						rgba(255, 255, 255, 0.03) 1px,
						transparent 1px
					),
					linear-gradient(
						to bottom,
						rgba(255, 255, 255, 0.03) 1px,
						transparent 1px
					);
				animation: grid-shift 4s linear infinite;
			}

			@keyframes grid-shift {
				0% {
					background-position: 0 0;
				}
				100% {
					background-position: 40px 40px;
				}
			}

			@keyframes fade-out {
				to {
					opacity: 0;
					transform: translate(-50%, -10px);
				}
			}

			.fade-out-on-scroll {
				animation: fade-out linear forwards;
				animation-timeline: scroll(root);
				animation-range: 0px 150px;
			}

			@media (max-width: 480px) {
				#hero-card {
					transform: scale(0.8);
					transform-origin: center center;
				}
			}

			/* #region hero card css */

			/* dot to box */
			.dot-to-box {
				animation: dot-to-box-div 1s cubic-bezier(0.6, 0, 0.2, 1);
			}
			.dot-to-box *:not(.no-fade) {
				/*transition-property: all;
				transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
				transition-duration: 150ms;
				animation: dot-to-box-child 1s cubic-bezier(0.4, 0, 0.2, 1);*/
			}

			.tech-icons {
				--target-opacity: 50%;
			}

			@keyframes dot-to-box-div {
				0% {
					width: 0;
					height: 0;
					padding: 0;
					overflow: hidden;
				}
				50% {
					width: 0;
					height: 10.4rem; /* 0.5 tailwind units = 0.125 rem */
					padding-left: 0;
					padding-right: 0;
					overflow: hidden;
				}
				100% {
					width: 25rem;
					height: 10.4rem;
					overflow: visible;
				}
			}

			/*@keyframes dot-to-box-child {
				0%,
				70% {
					opacity: 0%;
				}
				100% {
					opacity: var(--target-opacity, 100%);
				}
			}*/

			/* wordslider */
			:root {
				--wordslider-slide-height: 40px; /* Height of a single line of text */
				--wordslider-num-words: 4; /* Number of unique words (excluding the loop duplicate) */
			}

			.wordslider-box {
				font-family: sans-serif;
				font-size: 32px;
				font-weight: bold;
				display: flex;
				align-items: center;
				height: var(--wordslider-slide-height);
				overflow: hidden; /* Hides the words waiting in queue */
			}

			.wordslider-words {
				margin-left: 10px;
				height: var(--wordslider-slide-height);
			}

			.wordslider-word-wrapper {
				/*
                Total duration = 6 seconds (2s per unique word).
                'infinite' keeps the cycle going forever.
                */
				animation: wordslider-slide-up 8s
					cubic-bezier(0.77, 0, 0.175, 1) infinite;
			}

			.wordslider-word {
				height: var(--wordslider-slide-height);
				line-height: var(--wordslider-slide-height);
				color: #ff581b;
			}

			/*
            Keyframes formula for steps:
            0% to 25% -> Show word 1 (0px)
            33% to 58% -> Show word 2 (-40px)
            66% to 91% -> Show word 3 (-80px)
            100% -> Snap back to the duplicate word 1 (-120px), instantly resetting to 0%

            word count:
            2 -> 0%, 40% -- 50%, 90% -- 100%
            3 -> 0%, 25% -- 33%, 58% -- 66%, 91% -- 100%
            4 -> 0%, 18% -- 25%, 43% -- 50%, 68% -- 75%, 93% -- 100%
            5 -> 0%, 15% -- 20%, 35% -- 40%, 55% -- 60%, 75% -- 80%, 95% -- 100%
            6 -> 0%, 12% -- 16.6%, 28.6% -- 33.3%, 45.3% -- 50%, 62% -- 66.6%, 78.6% -- 83.3%, 95.3% -- 100%
            7 -> 0%, 10% -- 14.3%, 24.3% -- 28.6%, 38.6% -- 42.9%, 52.9% -- 57.1%, 67.1% -- 71.4%, 81.4% -- 85.7%, 95.7% -- 100%
            */
			@keyframes wordslider-slide-up {
				0%,
				18% {
					transform: translateY(0);
				}
				25%,
				43% {
					transform: translateY(
						calc(-1 * var(--wordslider-slide-height))
					);
				}
				50%,
				68% {
					transform: translateY(
						calc(-2 * var(--wordslider-slide-height))
					);
				}
				75%,
				93% {
					transform: translateY(
						calc(-3 * var(--wordslider-slide-height))
					);
				}
				100% {
					transform: translateY(
						calc(-4 * var(--wordslider-slide-height))
					);
				}
			}
			/* #endregion */
		</style>
